name: Publicar calculadora no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Testar e compilar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter o codigo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preparar Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Executar os testes
        run: npm test
      - name: Compilar para o caminho do repositorio
        run: npm run build -- --base-href /guarushop-calculadora/
      - name: Preparar arquivos estaticos
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publicar no Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar aplicacao
        id: deployment
        uses: actions/deploy-pages@v4
